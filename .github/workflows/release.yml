name: Release mod to Modrinth/Curseforge

on: [ workflow_dispatch ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true


      - name: Get Property

        uses:  christian-draeger/read-properties@1.1.1
        id: read_property
        with:
          path: './gradle.properties'
          properties: 'mod_version archives_base_name'

      - name: check env
        run: env

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 25

      - name: make Gradle Wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: datagen
        run: ./gradlew clean runDatagen

      - name: build
        run: ./gradlew build

      - name: production server compatibility
        run: |
          for candidate in build/libs/*.jar; do
            case "$candidate" in
              *-sources.jar) ;;
              *) JAR="$candidate" ;;
            esac
          done
          test -n "${JAR:-}"
          ./scripts/test-production-server.sh 26.1 0.145.1+26.1 "$JAR"
          ./scripts/test-production-server.sh 26.1.1 0.145.4+26.1.1 "$JAR"
          ./scripts/test-production-server.sh 26.1.2 0.155.2+26.1.2 "$JAR"

      - name: release to Modrinth/Curseforge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: 1072043
          curseforge-token: "${{secrets.PUBLISH_CURSEFORGE_TOKEN}}"

          modrinth-id: dsEsgw8u
          modrinth-token: "${{ secrets.PUBLISH_MODRINTH_TOKEN }}"

          version-type: beta
          changelog-file: CHANGELOG.md
          files: build/libs/!(*-sources).jar

          loaders: fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
          java: 25

          name: "${{ steps.read_property.outputs.archives_base_name }}+${{ steps.read_property.outputs.mod_version }}"
