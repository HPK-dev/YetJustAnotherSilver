name: build

on: [pull_request, push]

jobs:
  datagen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.4
            yarn: 1.21.4+build.8
            fabric_api: 0.119.4+1.21.4
          - minecraft: 1.21.5
            yarn: 1.21.5+build.1
            fabric_api: 0.119.4+1.21.5
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: generate data
        run: >-
          ./gradlew clean runDatagen
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Pfabric_version=${{ matrix.fabric_api }}
      - name: validate generated resources
        run: test -z "$(git status --porcelain --untracked-files=all -- src/main/generated/)"

  build:
    needs: datagen
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build production artifact
        run: ./gradlew clean build
      - name: capture production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  jar-checks:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-jar
          path: build/libs/
      - name: validate production JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected one production JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          fi

          jar_file="${jars[0]}"
          metadata="$(unzip -p "$jar_file" fabric.mod.json)"
          jq -e '.depends.minecraft == ["1.21.4", "1.21.5"]' <<<"$metadata" >/dev/null
          test "$(jq -r '.depends.java' <<<"$metadata")" = '>=21'
          test "$(jq -r '.depends.fabricloader' <<<"$metadata")" = '>=0.16.14'
          jq -e '(.depends.create? // null) == null' <<<"$metadata" >/dev/null

          entries="$(jar tf "$jar_file")"
          required_entries=(
            data/yjas/recipe/silver_ingot.json
            data/yjas/loot_table/blocks/silver_ore.json
            data/yjas/worldgen/configured_feature/silver_ore.json
            data/yjas/worldgen/placed_feature/silver_ore_placed.json
            data/c/tags/item/ingots/silver.json
            data/minecraft/tags/block/mineable/pickaxe.json
            assets/yjas/items/silver_ingot.json
            assets/yjas/models/item/silver_ingot.json
          )
          for entry in "${required_entries[@]}"; do
            if ! grep -qx "$entry" <<<"$entries"; then
              printf 'Missing required JAR entry: %s\n' "$entry" >&2
              exit 1
            fi
          done

          if grep -Eq '^data/yjas/(recipes|loot_tables)/' <<<"$entries"; then
            printf 'JAR contains obsolete plural data schema paths\n' >&2
            exit 1
          fi

          while IFS= read -r advancement; do
            if unzip -p "$jar_file" "$advancement" | jq -e \
              '[.criteria.has_the_recipe.conditions.recipe, .rewards.recipes[]] | all(startswith("yjas:"))' \
              >/dev/null; then
              continue
            fi
            printf 'Recipe advancement contains a non-yjas recipe ID: %s\n' "$advancement" >&2
            exit 1
          done < <(grep '^data/yjas/advancement/recipes/.*\.json$' <<<"$entries")

  server-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.4
            fabric_api: 0.119.4+1.21.4
          - minecraft: 1.21.5
            fabric_api: 0.119.4+1.21.5
    runs-on: ubuntu-22.04
    steps:
      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - name: download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-jar
          path: server/mods/
      - name: install Fabric server dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output server/fabric-server-launch.jar \
            "https://meta.fabricmc.net/v2/versions/loader/${{ matrix.minecraft }}/0.16.14/1.0.3/server/jar"
          curl --fail --location --retry 3 \
            --output "server/mods/fabric-api-${{ matrix.fabric_api }}.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.fabric_api }}/fabric-api-${{ matrix.fabric_api }}.jar"
          curl --fail --location --retry 3 \
            --output server/mods/fabric-language-kotlin-1.13.3+kotlin.2.1.21.jar \
            "https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/1.13.3+kotlin.2.1.21/fabric-language-kotlin-1.13.3+kotlin.2.1.21.jar"
          printf 'eula=true\n' > server/eula.txt
          printf 'server-port=0\n' > server/server.properties
      - name: boot production server
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          mkfifo server-input
          exec 3<>server-input
          java -Xms512M -Xmx1G -jar fabric-server-launch.jar nogui <&3 > >(tee server.log) 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..180}; do
            if grep -Fq 'Done (' server.log; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            printf 'Server did not finish startup within 180 seconds\n' >&2
            exit 1
          fi

          printf 'stop\n' >&3
          wait "$server_pid"
          trap - EXIT
          grep -F 'We add silver to your game!' server.log
          grep -F 'Done (' server.log
