name: build

on: [pull_request, push]

jobs:
  datagen:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: generate and validate data
        run: ./gradlew clean runDatagen
      - name: capture generated resources
        uses: actions/upload-artifact@v4
        with:
          name: generated-resources
          path: src/main/generated/
          if-no-files-found: error

  build:
    needs: datagen
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: restore generated resources
        uses: actions/download-artifact@v4
        with:
          name: generated-resources
          path: src/main/generated/
      - name: build production artifact
        run: ./gradlew clean build
      - name: capture production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  jar-checks:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-jar
          path: build/libs/
      - name: validate production JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected one production JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          fi

          jar_file="${jars[0]}"
          metadata="$(unzip -p "$jar_file" fabric.mod.json)"
          test "$(jq -r '.depends.minecraft' <<<"$metadata")" = '>=1.21.9 <1.21.11'
          test "$(jq -r '.depends.java' <<<"$metadata")" = '>=21'
          test "$(jq -r '.depends.fabricloader' <<<"$metadata")" = '>=0.19.3'
          jq -e '(.depends.create? // null) == null' <<<"$metadata" >/dev/null

          entries="$(jar tf "$jar_file")"
          required_entries=(
            data/yjas/recipe/silver_ingot.json
            data/yjas/loot_table/blocks/silver_ore.json
            data/yjas/worldgen/configured_feature/silver_ore.json
            data/yjas/worldgen/placed_feature/silver_ore_placed.json
            data/c/tags/item/ingots/silver.json
            data/minecraft/tags/block/mineable/pickaxe.json
            assets/yjas/items/silver_ingot.json
            assets/yjas/models/item/silver_ingot.json
          )
          for entry in "${required_entries[@]}"; do
            if ! rg -qx "$entry" <<<"$entries"; then
              printf 'Missing required JAR entry: %s\n' "$entry" >&2
              exit 1
            fi
          done

          if rg -q '^data/yjas/(recipes|loot_tables)/' <<<"$entries"; then
            printf 'JAR contains obsolete plural data schema paths\n' >&2
            exit 1
          fi
