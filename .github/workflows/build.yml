# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: generate data
        run: ./gradlew clean runDatagen
      - name: build
        run: ./gradlew build
      - name: test production servers
        run: |
          for candidate in build/libs/*.jar; do
            case "$candidate" in
              *-sources.jar) ;;
              *) JAR="$candidate" ;;
            esac
          done
          test -n "${JAR:-}"
          ./scripts/test-production-server.sh 26.1 0.145.1+26.1 "$JAR"
          ./scripts/test-production-server.sh 26.1.1 0.145.4+26.1.1 "$JAR"
          ./scripts/test-production-server.sh 26.1.2 0.155.2+26.1.2 "$JAR"
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
