# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  datagen:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: generate resources
        run: ./gradlew clean runDatagen
      - name: capture generated resources
        uses: actions/upload-artifact@v4
        with:
          name: Generated resources
          path: src/main/generated/

  build:
    needs: datagen
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: restore generated resources
        uses: actions/download-artifact@v4
        with:
          name: Generated resources
          path: src/main/generated/
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  jar-check:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: restore build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: verify generated resources in jar
        shell: bash
        run: |
          set -euo pipefail
          jar_file=""
          for candidate in build/libs/*.jar; do
            if [[ -f "$candidate" && "$candidate" != *-sources.jar ]]; then
              jar_file="$candidate"
              break
            fi
          done
          test -n "$jar_file"
          jar tf "$jar_file" > build/jar-contents.txt
          for entry in \
            assets/yjas/models/item/silver_ingot.json \
            data/c/tags/items/ingots/silver.json \
            data/yjas/recipes/silver_ingot.json \
            data/yjas/worldgen/configured_feature/silver_ore.json; do
            grep -Fxq "$entry" build/jar-contents.txt
          done
          unzip -p "$jar_file" fabric.mod.json | grep -Fq '"minecraft":">=1.20.3 <=1.20.4"'
          ! grep -Fq 'data/yjas/recipes/smelting/crushed_raw_silver.json' build/jar-contents.txt
          ! grep -Fq 'data/yjas/recipes/blasting/crushed_raw_silver.json' build/jar-contents.txt
          ! grep -Fq 'data/yjas/recipes/splashing/crushed_raw_silver.json' build/jar-contents.txt
